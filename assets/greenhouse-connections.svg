<text x="40" y="752" font-family="Arial" font-size="16" fill="#496277">Wszystkie moduły mają wspólną masę. SPI: SCK18, MOSI23, MISO19, CS27; INT26.</text>
<text x="40" y="776" font-family="Arial" font-size="16" fill="#496277">ADS: ADDR nr 1 → GND; ADDR nr 2 → 3,3 V. OLED oraz ADS współdzielą SDA21 / SCL22.</text>

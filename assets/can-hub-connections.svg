<text x="40" y="562" font-family="Arial" font-size="16" fill="#496277">CAN: skręcona para i terminacja 120 Ω na obu końcach każdej magistrali.</text>
<text x="40" y="586" font-family="Arial" font-size="16" fill="#496277">Schemat pomija przewody zasilania i GND. Administracyjny dostęp do WWW wymaga zaplanowanej łączności IP.</text>

$('plot').onmousemove=e=>{if(!plot||!mapping)return;let x=e.offsetX,target=plot.start+(x-mapping.left)/(mapping.right-mapping.left)*(plot.end-plot.start);let lines=[];for(let s of plot.series){let p=s.points.reduce((a,b)=>!a||Math.abs(b[0]-target)<Math.abs(a[0]-target)?b:a,null);if(p)lines.push(inputTime(p[0]).replace('T',' ')+' '+s.name+': '+p[1].toFixed(3)+' '+s.unit+' [min '+p[2].toFixed(3)+' / max '+p[3].toFixed(3)+']')}let tip=$('tip');tip.textContent=lines.join('\n');tip.style.display=lines.length?'block':'none';tip.style.left='10px';tip.style.top='45px'};$('plot').onmouseleave=()=>$('tip').style.display='none';new ResizeObserver(paint).observe($('plotbox'));
$('csv').onclick=()=>{if(!plot)return;let rows=[['time_panel','signal','mean','min','max','samples','unit']];for(let s of plot.series)for(let p of s.points)rows.push([new Date(p[0]*1000).toISOString().replace('Z',''),s.name,...p.slice(1),s.unit]);let csv=rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='can-hub-trends-view.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
async function loadFiles(){let files=await api('/files?offset='+offset+'&search='+encodeURIComponent($('search').value));lastFiles=files;$('files').replaceChildren();for(let f of files){let tr=document.createElement('tr'),selectCell=document.createElement('td'),check=document.createElement('input');check.type='checkbox';check.checked=selectedFiles.has(f.id);check.setAttribute('aria-label',f.path);check.onchange=()=>{if(check.checked)selectedFiles.set(f.id,{id:f.id,sha:f.sha,path:f.path});else selectedFiles.delete(f.id);updateSelected()};selectCell.append(check);tr.append(selectCell);for(let val of [f.path+(f.warning?' ⚠ '+f.warning:''),f.size+' B',date(f.downloaded),t[f.quality]||f.quality]){let td=document.createElement('td');td.textContent=val;tr.append(td)}let td=document.createElement('td'),a=document.createElement('a'),b=document.createElement('button');a.href='/can/api/sampling/file/'+f.id;a.textContent=t.download;b.textContent=t.version;b.style.marginLeft='10px';b.onclick=async()=>{try{let versions=await api('/versions/'+f.id);$('versions').replaceChildren();for(let v of versions){let a=document.createElement('a');a.href='/can/api/sampling/file/'+f.id+'?version='+v.sha;a.textContent=date(v.downloaded)+' · '+v.size+' B · '+(t[v.quality]||v.quality)+' · SHA256 '+v.sha.slice(0,16)+'…';$('versions').append(a)}$('versionDialog').showModal()}catch(e){msg(e.message)}};td.append(a,b);tr.append(td);$('files').append(tr)}$('page').textContent=(offset+1)+'–'+(offset+files.length);$('filesPrev').disabled=offset===0;$('filesNext').disabled=files.length<100;updateSelected()}
function updateSelected(running=wasRunning){$('selectedCount').textContent=t.selected+': '+selectedFiles.size;$('zip').disabled=$('remove').disabled=running||!selectedFiles.size;$('allFiles').checked=lastFiles.length>0&&lastFiles.every(f=>selectedFiles.has(f.id))}
$('allFiles').onchange=()=>{for(let f of lastFiles){if($('allFiles').checked)selectedFiles.set(f.id,{id:f.id,sha:f.sha,path:f.path});else selectedFiles.delete(f.id)}loadFiles().catch(e=>msg(e.message))};$('clear').onclick=()=>{selectedFiles.clear();loadFiles().catch(e=>msg(e.message))};
$('zip').onclick=async()=>{try{$('zip').disabled=true;let r=await fetch('/can/api/sampling/export',{method:'POST',headers:{'Content-Type':'application/json','X-Can-Hub':'1'},body:JSON.stringify({files:[...selectedFiles.values()]})});if(!r.ok)throw Error((await r.json()).detail);let url=URL.createObjectURL(await r.blob()),a=document.createElement('a');a.href=url;a.download='can-hub-sampling.zip';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){msg(e.message)}finally{updateSelected()}};
let pendingDeletion=[];
$('remove').onclick=()=>{pendingDeletion=[...selectedFiles.values()];$('deleteText').textContent=t.deleteConfirm+pendingDeletion.length+'\n'+pendingDeletion.slice(0,8).map(x=>x.path).join('\n');$('deleteDialog').showModal()};
$('cancelDelete').onclick=()=>$('deleteDialog').close();
$('confirmDelete').onclick=async()=>{try{$('confirmDelete').disabled=true;let d=await api('/delete',{files:pendingDeletion,confirm:'delete-from-rpi'});$('deleteDialog').close();selectedFiles.clear();await refresh();await loadFiles();await loadSets();msg(t.removed+': '+d.removed+' · '+t.freed+': '+mb(d.freed_bytes)+(d.warnings.length?'\n'+d.warnings.join('\n'):''))}catch(e){$('deleteDialog').close();msg(e.message)}finally{$('confirmDelete').disabled=false;updateSelected()}};
$('search').onsearch=$('search').onchange=()=>{offset=0;loadFiles().catch(e=>msg(e.message))};$('filesPrev').onclick=()=>{offset=Math.max(0,offset-100);loadFiles().catch(e=>msg(e.message))};$('filesNext').onclick=()=>{offset+=100;loadFiles().catch(e=>msg(e.message))};$('close').onclick=()=>$('versionDialog').close();
(async()=>{try{await refresh();await loadSets();await loadFiles();setInterval(()=>refresh().catch(e=>msg(e.message)),5000)}catch(e){msg(e.message)}})();

<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAN HUB · Monitor CAN</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b131e;color:#e4edf5;font:15px 'Segoe UI',sans-serif}main{max-width:1220px;margin:auto;padding:26px}header,.controls,.legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap}header{justify-content:space-between}a{color:#75e4cf}button,select{font:inherit;border-radius:8px;padding:10px;background:#20364a;color:white;border:1px solid #52677a}label{display:grid;gap:6px}section{padding:20px;margin:18px 0;background:#142232;border:1px solid #30475a;border-radius:12px}h1{font-size:27px}h2{font-size:19px}.meta{color:#b4c8d8;line-height:1.6}.bytes{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow:auto}.byte{padding:8px;border:1px solid #52677a;border-radius:8px}.bits{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin-top:8px}.bit{text-align:center;padding:6px 0;color:#06111b;font-weight:700;border-radius:3px}.bit small{display:block;font-size:9px;font-weight:400}.zero{background:#65d59b}.one{background:#ff777f}.data{background:#a8d9f5}.other{background:#c49c28}.unused{background:#87929d}.stale{border-color:#ff9a64}.warning{color:#ffba80}.legend span{padding:8px;border-radius:5px;color:#09131c}.effectivebits{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;max-width:700px;margin:5px 0 16px}.values{white-space:pre-wrap;line-height:1.8}dialog{background:#142232;color:#e4edf5;border:1px solid #52677a;border-radius:12px;max-width:760px;max-height:85vh;overflow:auto}dialog::backdrop{background:#000b}table{border-collapse:collapse;width:100%}td,th{padding:8px;text-align:left;border-bottom:1px solid #415365}@media(max-width:1000px){.bytes{grid-template-columns:repeat(2,minmax(220px,1fr))}}@media(max-width:520px){main{padding:12px}.bytes{grid-template-columns:1fr}}
</style>
<main><header><h1 id="title"></h1><a id="back" href="/can"></a></header><div class="controls"><label><span id="nodeLabel"></span><select id="nodes"></select></label><label><span id="signalLabel"></span><select id="signals"></select></label><button id="description"></button></div><p id="hint" class="meta"></p><div class="legend" id="legend"></div><p id="error" class="warning" role="status"></p><div id="frames"></div><section><h2 id="effectiveTitle"></h2><div id="effective" class="values"></div></section></main><dialog id="details"><h2 id="detailTitle"></h2><p id="detailHint"></p><table id="bitTable"></table><button id="close"></button></dialog>
<script>
const en=new URLSearchParams(location.search).get('lang')==='en';document.documentElement.lang=en?'en':'pl';const $=id=>document.getElementById(id),t=(pl,eng)=>en?eng:pl,esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const descriptions=[['Błąd pomiaru / źródła (zbiorczy)','Measurement / source error (summary)'],['Brak heartbeat modułu — HUB','Missing module heartbeat — HUB'],['Pomiar wyłączony przez użytkownika — HUB','Measurement disabled by user — HUB'],['Brak aktualnych danych — HUB','Missing fresh measurement — HUB'],['Brak aktualnej diagnostyki pasującej do zestawu — HUB','No fresh diagnostic matching measurement sequence — HUB'],['Inicjalizacja / pomiar niegotowy','Initializing / measurement not ready'],['Brak odpowiedzi czujnika','Sensor not responding'],['Przekroczony czas odczytu','Read timeout'],['Błąd CRC','CRC error'],['Błąd komunikacji z czujnikiem','Sensor communication error'],['Nieprawidłowy format odpowiedzi','Invalid response format'],['Pomiar poza zakresem','Measurement out of range'],['Przepełnienie wartości / mnożnika','Value / multiplier overflow'],['Błąd konfiguracji','Configuration error'],['Nasycenie wejścia','Input saturation'],['Inny błąd','Other error']];
$('title').textContent=t('Monitor ramek CAN','CAN frame monitor');$('back').textContent=t('← Powrót do CAN HUB','← Back to CAN HUB');$('back').href='/can?lang='+(en?'en':'pl');$('nodeLabel').textContent=t('Moduł / ID','Module / ID');$('signalLabel').textContent=t('Parametr','Parameter');$('description').textContent=t('Opis','Description');$('close').textContent=t('Zamknij','Close');$('effectiveTitle').textContent=t('Status efektywny i dane dla HMI (Modbus)','Effective status and data for HMI (Modbus)');$('detailTitle').textContent=t('ZNACZENIE BITÓW W KAŻDYM POLU STATUSU','MEANING OF BITS IN EACH STATUS FIELD');$('detailHint').textContent=t('Każdy pomiar ma 16 bitów. ESP32 przekazuje bity 0 i 5–15. Bity 1–4 ustala HUB; w surowej ramce ESP32 są nieużywane (szare). Bit 12 może również ustawić HUB przy przepełnieniu mnożnika. Grupy A: bajty 2–3, B: 4–5, C: 6–7.','Each measurement has 16 bits. ESP32 supplies bits 0 and 5–15. HUB supplies bits 1–4; they are unused (grey) in raw ESP32 frames. HUB can also set bit 12 on multiplier overflow. Groups A: bytes 2–3, B: 4–5, C: 6–7.');$('bitTable').innerHTML=descriptions.map((d,i)=>`<tr><th>${i}</th><td>${esc(d[en?1:0])}</td></tr>`).join('');$('description').onclick=()=>$('details').showModal();$('close').onclick=()=>$('details').close();
$('hint').textContent=t('Podgląd pasywny, odświeżanie co sekundę. Bajty od 0; w bajcie bity od 7 do 0. Nieaktualne ramki pozostają widoczne. Zera w nieskonfigurowanej grupie nie dowodzą, że nie jest używana — sprawdź dokumentację modułu.','Passive view, refreshed every second. Bytes start at 0; each byte shows bits 7 to 0. Stale frames remain visible. Zeroes in an unconfigured group do not prove it is unused — consult the module documentation.');
$('legend').innerHTML=[['zero','Status 0'],['one','Status 1'],['data',t('Dane','Data')],['other',t('Nagłówek / heartbeat','Header / heartbeat')],['unused',t('Bity zarezerwowane / nieużywane','Reserved / unused bits')]].map(([c,v])=>`<span class="${c}">${v}</span>`).join('');
let modules=[],busy=false,latest=null;
async function api(path){let r=await fetch('/can/api/'+path);if(r.status===401)throw Error(t('Zaloguj się w CAN HUB, a następnie wróć tutaj.','Log in to CAN HUB, then return here.'));if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
function selectModule(){let m=modules[+$('nodes').value];$('signals').innerHTML=`<option value="all">${t('Wszystkie parametry modułu','All module parameters')}</option>`+(m?.signals||[]).map((s,i)=>`<option value="${i}">${esc(s.name)}</option>`).join('');latest=null;$('frames').textContent='';refresh()}
function render(v){let m=v.module,selected=$('signals').value,sig=selected==='all'?null:m.signals[+selected];let fs=v.frames.filter(f=>!sig||f.kind==='heartbeat'||f.id===sig.can_id||f.id===(m.protocol>=2?sig.can_id+1:sig.error_can_id));$('frames').innerHTML=fs.map(f=>{
 let names=m.signals.filter(s=>s.can_id===f.id-(f.kind==='status')).map(s=>s.name).join(', ');
 let bytes=f.data.map((value,b)=>{let localByte=(b-2)%2;let bits=Array.from({length:8},(_,j)=>7-j).map(bit=>{let state=(value>>bit)&1,wordBit=localByte*8+bit;let reserved=f.kind==='status'&&m.protocol>=2&&b>=2&&wordBit>=1&&wordBit<=4;let cls=reserved?'unused':b<2||f.kind==='heartbeat'?'other':f.kind==='data'?'data':state?'one':'zero';let label=b>=2&&f.kind==='status'?` · status bit ${wordBit}`:'';return `<div class="bit ${cls}" title="${b}:${bit}${label}">${state}<small>b${bit}</small></div>`}).join('');return `<div class="byte">${t('Bajt','Byte')} ${b} · 0x${value.toString(16).padStart(2,'0').toUpperCase()}${b>=2&&f.kind!=='heartbeat'?' · '+['A','B','C'][Math.floor((b-2)/2)]:''}<div class="bits">${bits}</div></div>`}).join('');
 let decoded=f.data.length===8&&f.kind!=='heartbeat'?[0,1,2].map(i=>{let n=f.data[2+2*i]+256*f.data[3+2*i];if(f.kind==='data'&&n>=32768)n-=65536;return ['A','B','C'][i]+': '+n}).join(' · '):f.data.length===8&&f.kind==='heartbeat'?'Uptime: '+(f.data[4]+256*f.data[5]+65536*f.data[6]+16777216*f.data[7])+' s · '+t('Flagi modułu','Module flags')+': '+(f.data[2]+256*f.data[3]):'';
 return `<section class="${f.stale?'stale':''}"><h2>CAN${m.channel} · ${f.kind==='data'?t('Pomiary','Measurements'):f.kind==='status'?t('Status ESP32','ESP32 status'):'Heartbeat'} · ID ${f.id} / 0x${f.id.toString(16).toUpperCase()}</h2><div class="meta">${esc(names)}<br>DLC: ${f.dlc??'—'} · ${t('Wersja','Version')}: ${f.data[0]??'—'} · ${t('Sekwencja','Sequence')}: ${f.data[1]??'—'} · ${t('Wiek odbioru','Reception age')}: ${f.age??'—'} s · ${t('Wiek sekwencji','Sequence age')}: ${f.sequence_age??'—'} s · RX: ${f.count} · ${f.stale?t('NIEAKTUALNA / BRAK','STALE / MISSING'):f.format_ok===false?t('BŁĘDNY FORMAT','INVALID FORMAT'):'OK'}<br>${decoded}</div><div class="bytes">${bytes||t('Nie odebrano ramki','No frame received')}</div></section>`}).join('');
 $('effective').innerHTML=v.effective.signals.map((s,i)=>selected!=='all'&&+selected!==i?'':`${esc(s.name)}: ${s.value} · status ${s.status_word??'—'} / 0x${(s.status_word??0).toString(16).padStart(4,'0')} · ${t('wiek','age')} ${s.age??'—'} s<div class="effectivebits">${s.status_word===undefined?'':Array.from({length:16},(_,j)=>15-j).map(b=>`<div class="bit ${(s.status_word>>b)&1?'one':'zero'}" title="${esc(descriptions[b][en?1:0])}">${(s.status_word>>b)&1}<small>${b}</small></div>`).join('')}</div>`).filter(Boolean).join('<br>');
}
async function refresh(){if(busy||!modules.length)return;busy=true;const key=$('nodes').value,m=modules[+key];try{let v=await api(`monitor?channel=${m.channel}&node=${m.id}`);if(key===$('nodes').value){latest=v;render(v);$('error').textContent=Object.keys(v.errors).length?t('Błąd interfejsu CAN — sprawdź stronę Status.','CAN interface error — check Status page.'):'';}}catch(e){$('error').textContent=e.message;latest=null;$('frames').textContent='';$('effective').textContent='';}finally{busy=false}}
$('nodes').onchange=selectModule;$('signals').onchange=()=>{if(latest)render(latest)};
api('config').then(c=>{modules=c.modules;$('nodes').innerHTML=modules.map((m,i)=>`<option value="${i}">${esc(m.name)} · CAN${m.channel} / ID ${m.id}</option>`).join('');if(!modules.length)$('error').textContent=t('Brak modułów','No modules');selectModule();setInterval(refresh,1000)}).catch(e=>$('error').textContent=e.message);
</script></html>
